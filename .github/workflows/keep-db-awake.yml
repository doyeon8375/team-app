name: keep-db-awake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        env:
          RAW_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "값 길이: ${#RAW_URL}"
          echo "앞 10글자: $(printf '%s' "$RAW_URL" | head -c 10)"
          URL=$(printf '%s' "$RAW_URL" | grep -oE "postgres(ql)?://[^\"' ]+" | head -1)
          if [ -z "$URL" ]; then echo "postgresql:// 주소를 찾지 못함"; exit 1; fi
          echo "주소 찾음"
          command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
          psql "$URL" -v ON_ERROR_STOP=1 -t -c "select count(*) from tf_students;" > /dev/null
          echo "DB 질의 성공"
