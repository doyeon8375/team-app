   name: keep-db-awake

   on:
     schedule:
       - cron: "17 0 * * *"
     workflow_dispatch: {}

   jobs:
     ping:
       runs-on: ubuntu-latest
       steps:
         - name: Query Supabase
           env:
             RAW_URL: ${{ secrets.DATABASE_URL }}
           run: |
             URL=$(printf '%s' "$RAW_URL" | tr -d "\"' \r\n")
             if [ -z "$URL" ]; then echo "DATABASE_URL: 없음"; exit 1; fi
             echo "DATABASE_URL: 있음"
             command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
             psql "$URL" -v ON_ERROR_STOP=1 -t -c "select count(*) from tf_students;" > /dev/null
             echo "DB 질의 성공"
